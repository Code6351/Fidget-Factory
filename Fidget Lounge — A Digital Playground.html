<script>
(()=>{
const root=document.getElementById('pb-game'),cv=document.getElementById('pb-cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const ROUND=30,PI=Math.PI;const FLX=()=>{try{return parent.FL.calm()}catch(e){return false}};
let W,H,dpr,bgc,bw,bh,cl,cx,fy;
let state='menu',cs=0,t0=0,timeLeft=ROUND,score=0,clicks=0,peak=0,best=0,inten=0,mult=1,pro=false,hits=[];
let theta=0,omega=0,shake=0,fl=null,flA=0,last=performance.now(),bigT=0;
const parts=[],rings=[],texts=[],gloves=[];
try{best=+localStorage.getItem('pb_best')||0}catch(e){}

/* ---------- audio ---------- */
let ac;
function ctxA(){try{if(!parent.FL.snd())return null}catch(e){return null}try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function thud(i){const a=ctxA();if(!a)return;try{const n=a.currentTime,o=a.createOscillator(),g=a.createGain();
o.frequency.setValueAtTime(150+i*140,n);o.frequency.exponentialRampToValueAtTime(40,n+.12);
g.gain.setValueAtTime(.55,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+.16);
const b=a.createBuffer(1,2205,44100),d=b.getChannelData(0);for(let k=0;k<2205;k++)d[k]=(Math.random()*2-1)*(1-k/2205);
const s=a.createBufferSource(),g2=a.createGain();s.buffer=b;g2.gain.value=.18+i*.2;s.connect(g2);g2.connect(a.destination);s.start(n);}catch(e){}}
function bell(f){const a=ctxA();if(!a)return;try{const n=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;
g.gain.setValueAtTime(.4,n);g.gain.exponentialRampToValueAtTime(.001,n+1.2);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+1.3);}catch(e){}}

/* ---------- layout + static background ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function resize(){
  W=root.clientWidth;H=root.clientHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;bw=Math.min(W*.4,H*.2,190);bh=bw*2.5;cl=H*.14;fy=H*.78;
  bgc=document.createElement('canvas');bgc.width=W*dpr;bgc.height=H*dpr;
  const g=bgc.getContext('2d');g.scale(dpr,dpr);
  let gr=g.createLinearGradient(0,0,0,fy);gr.addColorStop(0,'#14101c');gr.addColorStop(1,'#2b1a1f');g.fillStyle=gr;g.fillRect(0,0,W,fy);
  const bH=26,bW=56;g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.5;
  for(let r=0;r*bH<fy;r++){const off=r%2?bW/2:0;for(let x=-off;x<W;x+=bW){g.fillStyle='rgba(255,'+(120+((r*7+x)%40|0))+',90,'+(.025+((r*31+x*7)%10)/400)+')';g.fillRect(x+1,r*bH+1,bW-2,bH-2);g.strokeRect(x,r*bH,bW,bH);}}
  gr=g.createLinearGradient(0,fy,0,H);gr.addColorStop(0,'#3d2616');gr.addColorStop(1,'#120a07');g.fillStyle=gr;g.fillRect(0,fy,W,H-fy);
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=2;
  for(let i=-12;i<=12;i++){g.beginPath();g.moveTo(cx+i*W*.045,fy);g.lineTo(cx+i*W*.2,H);g.stroke();}
  for(let k=1;k<6;k++){const y=fy+(H-fy)*(k*k/36);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  g.fillStyle='#0c0709';g.fillRect(0,fy-8,W,8);
  g.fillStyle='rgba(255,255,255,.07)';g.fillRect(0,fy-8,W,2);
  // neon sign
  g.font=Math.max(22,W*.075)+"px 'Bebas Neue',Impact,sans-serif";g.textAlign='left';g.shadowColor='#ff2d9a';g.shadowBlur=18;g.fillStyle='#ff8fcb';
  g.fillText('NO PAIN',14,fy-70);g.fillText('NO GAIN',14,fy-70+Math.max(22,W*.075));g.shadowBlur=0;
  // spotlight cone + lamp
  gr=g.createLinearGradient(0,0,0,fy);gr.addColorStop(0,'rgba(255,238,200,.22)');gr.addColorStop(1,'rgba(255,238,200,0)');
  g.fillStyle=gr;g.beginPath();g.moveTo(cx-24,6);g.lineTo(cx+24,6);g.lineTo(cx+W*.55,fy);g.lineTo(cx-W*.55,fy);g.fill();
  g.fillStyle='#1b1b22';g.fillRect(0,0,W,8);
  g.fillStyle='#2a2a33';g.beginPath();g.moveTo(cx-34,8);g.lineTo(cx+34,8);g.lineTo(cx+18,22);g.lineTo(cx-18,22);g.fill();
  g.fillStyle='#fff3cf';g.shadowColor='#ffe9a8';g.shadowBlur=20;g.fillRect(cx-16,21,32,4);g.shadowBlur=0;
  gr=g.createRadialGradient(cx,H*.45,Math.min(W,H)*.25,cx,H*.45,Math.max(W,H)*.8);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.7)');g.fillStyle=gr;g.fillRect(0,0,W,H);
}

/* ---------- bag ---------- */
function drawBag(){
  const w=bw,h=bh,x0=-w/2,y0=cl,r=w*.3;
  // chain
  const lh=w*.11,n=Math.ceil((cl-lh)/lh);
  for(let i=0;i<n;i++){const y=i*lh+lh/2+4;ctx.beginPath();ctx.ellipse(0,y,i%2?w*.045:w*.014,lh*.62,0,0,PI*2);ctx.lineWidth=w*.026;ctx.strokeStyle='#0d0d10';ctx.stroke();ctx.lineWidth=w*.016;ctx.strokeStyle=i%2?'#c4c9d2':'#8a8f99';ctx.stroke();}
  // swivel + straps
  ctx.strokeStyle='#3b1a10';ctx.lineWidth=w*.055;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,cl-lh*.6);ctx.lineTo(-w*.38,y0+h*.07);ctx.moveTo(0,cl-lh*.6);ctx.lineTo(w*.38,y0+h*.07);ctx.stroke();
  ctx.strokeStyle='#7a4a2a';ctx.lineWidth=w*.02;ctx.stroke();
  ctx.fillStyle='#aab0ba';ctx.beginPath();ctx.arc(0,cl-lh*.6,w*.07,0,PI*2);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.stroke();
  // body
  ctx.save();rr(ctx,x0,y0,w,h,r);ctx.clip();
  let g=ctx.createLinearGradient(x0,0,x0+w,0);
  [[0,'#3a0709'],[.18,'#8e1b1b'],[.42,'#e0453a'],[.55,'#c8352c'],[.82,'#7a1414'],[1,'#2e0507']].forEach(s=>g.addColorStop(s[0],s[1]));
  ctx.fillStyle=g;ctx.fillRect(x0,y0,w,h);
  for(let i=0;i<90;i++){const a=Math.abs(Math.sin(i*12.9898)*43758.5)%1,b=Math.abs(Math.sin(i*78.233)*12345.6)%1;ctx.fillStyle='rgba(0,0,0,.09)';ctx.beginPath();ctx.arc(x0+a*w,y0+b*h,w*.008+a*1.2,0,PI*2);ctx.fill();}
  [.2,.5,.8].forEach(p=>{const y=y0+h*p;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x0,y-2,w,4);ctx.fillStyle='rgba(255,200,170,.18)';ctx.fillRect(x0,y+2,w,1.5);

 home:()=>`<section class="hero"><div class="stk" aria-hidden="true"><i style="--x:4%;--y:16%;--d:0s">🫧</i><i style="--x:90%;--y:8%;--d:.6s">🌀</i><i style="--x:9%;--y:70%;--d:1.2s">🧩</i><i style="--x:92%;--y:66%;--d:.3s">✨</i></div><span class="pill">✨ A digital toy box for restless hands</span><h1 class="mega">Fidget <em>Lounge</em></h1><p class="mut" style="font-size:1.25rem;max-width:560px;margin:0 auto 10px">A digital playground for restless hands and curious minds.</p><p class="d" style="font-size:1.7rem;margin-bottom:26px">Nothing to accomplish. Nothing to win. Just fidget.</p><a class="btn p big" href="#/playground">✨ Start fidgeting</a></section><div class="mq" aria-hidden="true"><div>${[...F,...F].map(f=>`<span>${f.e} ${f.n}</span>`).join('')}</div></div>
 <section aria-labelledby="ff"><div class="row" style="justify-content:space-between;margin:16px 0"><h2 id="ff">Featured fidgets</h2><a href="#/categories"><b>Browse all →</b></a></div><div class="grid g4">${F.map(card).join('')}</div></section>
 <section aria-labelledby="pk" style="margin-top:44px"><h2 id="pk" style="text-align:center;margin-bottom:16px">Pick your fidget</h2><div class="grid g6">${CATS.map(c=>`<a class="card" style="text-align:center;text-decoration:none" href="#/categories?cat=${c[0]}"><div style="font-size:2.4rem" aria-hidden="true">${c[2]}</div><h3>${c[1]}</h3><div class="mut" style="font-size:.95rem">${c[3]}</div></a>`).join('')}</div></section>`,
 playground:(q)=>{const id=F.find(f=>f.id==q.fidget)?q.fidget:(ld('fl:last',{id:F[0].id}).id);const f=F.find(x=>x.id==id)||F[0];sv('fl:last',{id:f.id});S.totalSessions++;S.fidgetUsage[f.id]=(S.fidgetUsage[f.id]||0)+1;check();
  return`<div class="pg"><aside aria-label="Choose a fidget"><div class="card"><b class="mut" style="text-transform:uppercase;letter-spacing:.08em;font-size:.8rem">Fidgets</b><div class="list">${F.map(x=>`<button class="btn" aria-pressed="${x.id==f.id}" data-f="${x.id}">${x.e} ${x.n}</button>`).join('')}</div></div></aside><section><div class="card row" style="justify-content:space-between;margin-bottom:14px"><div><h1 style="font-size:1.8rem" id="ph" tabindex="-1">${f.e} ${f.n}</h1><p class="mut" style="margin:2px 0 0">${f.ins}</p></div><div class="row"><button class="btn" id="rst">↺ Reset</button><button class="btn ${P.soundEnabled?'p':''}" id="snd" aria-pressed="${P.soundEnabled}">${P.soundEnabled?'🔊 Sound on':'🔇 Sound off'}</button><button class="btn" id="fs">⛶ Fullscreen</button></div></div><div class="stage" id="stage"></div></section></div>`},
 categories:q=>{const c=q.cat||'all',cc=CATS.find(x=>x[0]==c),L=c=='all'?F:F.filter(f=>f.cat==c);return`<h1 style="font-size:2.4rem">Categories</h1><p class="mut">Find your kind of fidget.</p><div class="row" style="justify-content:flex-start;margin:18px 0" role="group" aria-label="Filter by category"><a class="btn ${c=='all'?'on':''}" href="#/categories" ${c=='all'?'aria-current="true"':''}>All</a>${CATS.map(x=>`<a class="btn ${c==x[0]?'on':''}" href="#/categories?cat=${x[0]}" ${c==x[0]?'aria-current="true"':''}>${x[2]} ${x[1]}</a>`).join('')}</div>${cc?`<h2>${cc[1]}</h2><p class="mut">${cc[3]}</p>`:''}<div class="grid g4" style="margin-top:12px">${L.map(card).join('')||'<p class="mut">No fidgets here yet — check back soon! The Weird Stuff shelf is waiting for its first toy.</p>'}</div>`},
 stats:()=>{const l=lvl(S.xp),xi=S.xp-cum(l),xn=100*l,fv=Object.entries(S.fidgetUsage).sort((a,b)=>b[1]-a[1])[0],ff=fv&&F.find(f=>f.id==fv[0]),n=Object.values(S.achievements).filter(Boolean).length;
  const rows=[['Total clicks',S.totalClicks,'👆'],['Button presses',S.totalButtonPresses,'🔘'],['Bubbles popped',S.bubblesPopped,'🫧'],['Gear revolutions',Math.floor(S.gearRevolutions),'⚙️'],['Puzzles completed',S.puzzlesCompleted,'🧩'],['Race distance (m)',S.raceDistance,'🏁'],['Fidget sessions',S.totalSessions,'🎮'],['Best clicks/sec',S.bestCPS.toFixed(1),'⚡']];
  return`<h1 style="font-size:2.4rem">My fidget stats</h1><p class="mut">Saved on this device.</p><section class="card" style="margin:20px 0" aria-label="Level"><div class="row" style="justify-content:space-between"><div><small class="mut">LEVEL</small><div class="d" style="font-size:3rem;color:var(--pri)">${l}</div></div><div style="text-align:right"><b>${xi} / ${xn} XP</b><div class="mut">${xn-xi} XP to level ${l+1}</div></div></div><div class="bar2" role="progressbar" aria-valuemin="0" aria-valuemax="${xn}" aria-valuenow="${xi}" aria-label="XP progress"><div style="width:${xi/xn*100}%"></div></div></section>
  <div class="grid g6" style="margin-bottom:20px">${rows.map(r=>`<div class="card" style="text-align:center"><div style="font-size:1.6rem" aria-hidden="true">${r[2]}</div><b class="d" data-cu style="font-size:1.7rem">${r[1]}</b><div class="mut" style="font-size:.9rem">${r[0]}</div></div>`).join('')}</div>
  ${ff?`<div class="card ach" style="margin-bottom:24px"><span class="ic" aria-hidden="true">${ff.e}</span><div><small class="mut">FAVORITE FIDGET</small><h3>${ff.n}</h3></div></div>`:''}
  <div class="row" style="justify-content:space-between"><h2>Achievements</h2><span class="mut">${n} / ${ACH.length}</span></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:14px 0 26px">${ACH.map(a=>{const u=S.achievements[a[0]];return`<div class="card ach ${u?'':'off'}"><span class="ic" aria-hidden="true">${a[3]}</span><div><h3 style="font-size:1.1rem">${a[1]}</h3><div class="mut" style="font-size:.95rem">${a[2]}</div><b style="color:var(--pri);font-size:.8rem">${u?'✓ UNLOCKED':'Locked'}</b></div></div>`}).join('')}</div><button class="btn" id="wipe">🗑 Reset all stats</button>`},
 about:()=>`<div style="max-width:640px;margin:auto"><h1 style="font-size:2.4rem;margin-bottom:14px">About Fidget Lounge</h1><p style="font-size:1.2rem">Fidget Lounge is a collection of digital toys for people who enjoy clicking, spinning, tapping, dragging, solving little puzzles, and generally messing around with interactive things.</p><p class="mut">There's no requirement to be productive or competitive here. Sometimes you just want something to fidget with — a gear to spin, a button to press, a bubble to pop, a spinner to flick.</p><p class="mut">Pick a toy, play for a minute or an hour, switch to another, come back later. Your stats are saved locally on your device, and you never need an account.</p><p class="mut">If you find yourself smiling while a gear turns, we did our job.</p><div class="card" style="text-align:center;margin-top:28px"><h2>Ready to fidget?</h2><p class="mut">Nothing to accomplish. Nothing to win. Just fidget.</p><a class="btn p" href="#/playground">✨ Open the playground</a></div><p class="mut" style="text-align:center;font-size:.95rem;margin-top:22px">Sound is off by default. Built for mouse, touch, and keyboard — open ⚙ Settings for motion, contrast and size options.</p></div>`
};
const NAV=[['','Home'],['playground','Playground'],['categories','Categories'],['stats','My Stats'],['about','About']];
function route(){const [p,qs]=location.hash.slice(2).split('?'),q=Object.fromEntries(new URLSearchParams(qs||'')),k=PG[p||'home']?p||'home':'home';
 $('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" ${n[0]==(p||'')?'aria-current="page"':''}>${n[1]}</a>`).join('');
 const m=$('#main');m.innerHTML=PG[k](q);document.title=(k=='home'?'':NAV.find(n=>n[0]==k)?.[1]+' · ')+'Fidget Lounge';
 if(k=='playground'){const id=F.find(f=>f.id==q.fidget)?q.fidget:ld('fl:last',{id:F[0].id}).id,f=F.find(x=>x.id==id)||F[0],mount=()=>{const s=$('#stage');s.innerHTML='';f.run(s)};mount();
  $$('[data-f]').forEach(b=>b.onclick=()=>{history.replaceState(null,'','#/playground?fidget='+b.dataset.f);route()});$('#rst').onclick=mount;$('#snd').onclick=()=>{P.soundEnabled=!P.soundEnabled;applyP();const b=$('#snd');b.textContent=P.soundEnabled?'🔊 Sound on':'🔇 Sound off';b.classList.toggle('p',P.soundEnabled);b.setAttribute('aria-pressed',P.soundEnabled)};$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('#stage').requestFullscreen?.();}
 if(k=='stats')$('#wipe').onclick=()=>{if(confirm('Reset all your fidget stats and achievements?')){S=structuredClone(DS);pl=1;sv('fl:stats',S);hdr();route()}};
 m.classList.remove('in');void m.offsetWidth;m.classList.add('in');cu(m);scrollTo(0,0);if(!route.first){route.first=1}else{(($('#ph')||$('h1',m))||m).focus?.()}}
// settings
const dlg=$('#dlg');
function opts(){$('#opts').innerHTML=OPTS.map(o=>`<label class="opt"><input type="checkbox" data-k="${o[0]}" ${(o[0]=='darkMode'?dm():P[o[0]])?'checked':''}><span><b>${o[1]}</b><small>${o[2]}</small></span></label>`).join('');$$('#opts input').forEach(i=>i.onchange=()=>{P[i.dataset.k]=i.checked;applyP()})}
$('#setb').onclick=()=>{opts();dlg.showModal()};$('#dx').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target==dlg)dlg.close()};$('#rs').onclick=()=>{P={...DP};applyP();opts()};
const calm=()=>FL.calm();let lp={x:0,y:0,t:0};
addEventListener('pointerdown',e=>{lp={x:e.clientX,y:e.clientY,t:performance.now()};const b=e.target.closest&&e.target.closest('.btn,nav a');if(b&&!b.closest('#stage')){sfx.click();if(!calm()&&b.classList.contains('btn')){const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='rp';s.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px`;b.append(s);setTimeout(()=>s.remove(),600)}}},true);
function floatXP(g){const n=performance.now();if(calm()||n-(floatXP.t||0)<140)return;floatXP.t=n;const st=$('#stage');let x=lp.x,y=lp.y;if(n-lp.t>500||!st){const r=(st||$('#lv')).getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}const s=document.createElement('span');s.className='xpf';s.textContent='+'+g+' XP';s.setAttribute('aria-hidden','true');s.style.cssText=`left:${x}px;top:${y}px`;document.body.append(s);s.animate([{transform:'translate(-50%,0) scale(.6)',opacity:0},{transform:'translate(-50%,-18px) scale(1.15)',opacity:1,offset:.25},{transform:'translate(-50%,-58px) scale(1)',opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>s.remove();const l=$('#lv');l.classList.remove('bump');void l.offsetWidth;l.classList.add('bump')}
function burst(){if(calm())return;const c=document.createElement('canvas');c.setAttribute('aria-hidden','true');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70';c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext('2d'),r=$('#lv').getBoundingClientRect(),col=['#8cc4fa','#6fe0bb','#b7d9fb','#9be8cf','#a9bcff'],P=Array.from({length:90},()=>{const a=Math.random()*Math.PI*.9+.15,s=5+Math.random()*9;return{x:r.left+r.width/2,y:r.bottom,vx:Math.cos(a)*s*(Math.random()<.5?-1:1),vy:Math.sin(a)*s,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:Math.random()*.4-.2,c:col[R(0,4)]}}),t0=performance.now(),f=t=>{const k=(t-t0)/1500;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});k<1?requestAnimationFrame(f):c.remove()};requestAnimationFrame(f)}
function cu(m){if(calm())return;$$('[data-cu]',m).forEach(e=>{const t=e.textContent,v=parseFloat(t),d=(t.split('.')[1]||'').length;if(!(v>0))return;const t0=performance.now(),f=n=>{const k=Math.min(1,(n-t0)/800);e.textContent=(v*(1-Math.pow(1-k,3))).toFixed(d);k<1?requestAnimationFrame(f):e.textContent=t};requestAnimationFrame(f)});const b=$('.bar2>div',m);if(b){const w=b.style.width;b.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=w))}}
document.addEventListener('pointermove',e=>{const c=e.pointerType=='mouse'&&!calm()&&e.target.closest&&e.target.closest('.fc');$$('.fc.t').forEach(x=>{if(x!==c){x.classList.remove('t');x.style.transform=''}});if(!c)return;const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;c.classList.add('t');c.style.transform=`perspective(700px) rotateY(${px*7}deg) rotateX(${-py*7}deg) translateY(-4px)`});
addEventListener('hashchange',route);applyP();hdr();route();
</script></body></html>
